version: 2

semantic_models:
  - name: orders
    description: "Semantic model for order analytics"
    model: ref('fct_orders')

    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: status
        type: categorical
      - name: shipping_country_code
        type: categorical
      - name: has_discount
        type: categorical
      - name: is_overdue
        type: categorical

    measures:
      - name: order_count
        description: "Number of orders"
        agg: count
        expr: order_id
      - name: total_revenue
        description: "Total revenue"
        agg: sum
        expr: order_total
      - name: avg_order_value
        description: "Average order value"
        agg: average
        expr: order_total