name: dbt Scheduled Production Run

on:
  schedule:
    - cron: '0 6 * * *'    # 6am UTC every day
  workflow_dispatch:         # manual trigger button in GitHub UI

env:
  DBT_VERSION: 1.8.0

jobs:
  dbt-scheduled:
    name: Daily Production Refresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          ecommerce_analytics:
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: dbt_dev_role
                database: ecommerce_prod
                warehouse: dbt_dev_wh
                schema: prod
                threads: 8
            target: prod
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt seed
        run: dbt seed --target prod

      - name: dbt snapshot
        run: dbt snapshot --target prod

      - name: dbt build
        run: dbt build --target prod

      - name: dbt compile
        run: dbt compile --target prod

      - name: Save prod artifacts
        uses: actions/upload-artifact@v3
        with:
          name: prod-artifacts
          path: target/manifest.json
          retention-days: 30

      - name: Success summary
        if: success()
        run: |
          echo "✅ Scheduled run complete!"
          echo "Time: $(date)"
          echo "Database: ecommerce_prod"

      - name: Failure summary
        if: failure()
        run: |
          echo "❌ Scheduled run FAILED!"
          echo "Time: $(date)"
          echo "Check GitHub Actions logs"
