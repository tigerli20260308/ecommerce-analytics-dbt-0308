version: 2

models:
  - name: dim_customers
    description: "{{ doc('dim_customers') }}"     
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email — unique identifier"
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "{{ doc('customer_segment') }}"     
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['no_orders','new','returning','loyal']
      - name: is_active_customer
        description: "Has placed at least one order"
        tests:
          - not_null

  - name: dim_products
    description: "{{ doc('dim_products') }}"     
    columns:
      - name: product_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: revenue_tier
        description: "Revenue classification high/medium/low"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['high','medium','low']
      - name: sales_velocity
        description: "Sales speed classification"
        tests:
          - not_null

  - name: fct_orders
    description: "{{ doc('fct_orders') }}"     
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_total
        description: "Total order value after discounts"
        tests:
          - not_null
      - name: is_overdue
        description: "Whether order exceeded SLA days"
        tests:
          - not_null

  - name: fct_payments
    description: "{{ doc('fct_payments') }}"     
    columns:
      - name: payment_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_orders"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: net_payment_amount
        description: "Payment amount after processing fees"
        tests:
          - not_null