version: 2

models:
  - name: stg_customers
    description: "Staged customers — cleaned and typed from raw"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email — lowercased"
        tests:
          - unique
          - not_null
      - name: country_code
        description: "ISO 2-letter country code — uppercased"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['US','CA','UK','AU','DE','FR','SG','JP','IN','BR']
      - name: full_name
        description: "Derived — first + last name combined"
        tests:
          - not_null

  - name: stg_orders
    description: "Staged orders — cleaned and typed from raw"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: "Order status — lowercased"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['pending','processing','shipped',
                         'completed','cancelled']
      - name: order_date
        description: "Date order was placed"
        tests:
          - not_null

  - name: stg_products
    description: "Staged products — cleaned and typed from raw"
    columns:
      - name: product_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: sku
        description: "Stock keeping unit — unique product code"
        tests:
          - unique
          - not_null
      - name: unit_price
        description: "Selling price"
        tests:
          - not_null
      - name: gross_margin_pct
        description: "Derived — margin percentage"

  - name: stg_order_items
    description: "Staged order line items"
    columns:
      - name: order_item_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_orders"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: "Foreign key to stg_products"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: net_amount
        description: "Derived — gross amount minus discount"
        tests:
          - not_null

  - name: stg_payments
    description: "Staged payments — cleaned and typed from raw"
    columns:
      - name: payment_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_orders"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: "Payment method — lowercased"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['credit_card','debit_card','paypal',
                         'bank_transfer','apple_pay','google_pay','cash']
      - name: payment_status
        description: "Payment status — lowercased"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['success','pending','failed','refunded']

  - name: stg_events
    description: "Staged clickstream events"
    columns:
      - name: event_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_id
        description: "Browser session identifier"
        tests:
          - not_null
      - name: event_type
        description: "Type of event — lowercased"
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['page_view','add_to_cart',
                         'purchase','remove_from_cart']
      - name: event_date
        description: "Derived — date of event"
        tests:
          - not_null

  - name: stg_events_incremental
    description: "Incremental events — only loads new rows each run"
    columns:
      - name: event_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null

  - name: stg_payments_incremental
    description: "Incremental payments — only loads new rows each run"
    columns:
      - name: payment_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: payment_status
        tests:
          - not_null

  - name: stg_orders_incremental
    description: "Incremental orders — only loads new rows each run"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - not_null        